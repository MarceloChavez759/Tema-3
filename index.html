<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generador de Certificados</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=UnifrakturMaguntia&family=Cinzel:wght@700&display=swap" rel="stylesheet">
</head>
<body>

    <div class="interface">
        <section class="form-container">
            <h2>Datos del Certificado</h2>
            <div class="input-group">
                <label>Nombre del Alumno:</label>
                <input type="text" id="inputNombre" placeholder="Ej. Juan Pérez">
            </div>
            <div class="input-group">
                <label>Nombre del Curso:</label>
                <input type="text" id="inputCurso" placeholder="Ej. Programación Web Full Stack">
            </div>
            <div class="input-group">
                <label>Fecha de Emisión:</label>
                <input type="date" id="inputFecha">
            </div>
            <button onclick="imprimirCertificado()">Generar PDF / Imprimir</button>
        </section>

        <section class="preview-container">
            <div id="certificado">
                <div class="borde-exterior">
                    <div class="borde-interior">
                        <h1>Certificado de Reconocimiento</h1>
                        <p class="label">Se otorga el presente a:</p>
                        <p id="nombre" class="dato-principal">[Nombre del Alumno]</p>
                        <p class="label">Por haber completado con éxito el curso de:</p>
                        <p id="curso" class="dato-secundario">[Nombre del Curso]</p>
                        <div class="footer-cert">
                            <p id="fecha">[Fecha]</p>
                            <div class="firma">
                                <div class="linea-firma"></div>
                                <span>Firma del Instructor</span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </div>

    <script src="app.js"></script>
</body>
</html>
